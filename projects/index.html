    <script>
        const roles = [
            "technicians.",
            "Lighting Directors.",
            "Audio Engineers.",
            "DJs.",
            "VJs.",
            "Artists.",
            "Bands."
        ];
        let roleIndex = 0;
        const scrollWord = document.getElementById('scroll-word');

        setInterval(() => {
            scrollWord.style.opacity = '0';
            scrollWord.style.transform = 'translateY(-20px)';
            
            setTimeout(() => {
                roleIndex = (roleIndex + 1) % roles.length;
                scrollWord.textContent = roles[roleIndex];
                
                // Reset position to bottom for slide-in
                scrollWord.style.transition = 'none';
                scrollWord.style.transform = 'translateY(20px)';
                
                setTimeout(() => {
                    scrollWord.style.transition = 'all 0.5s cubic-bezier(0.23, 1, 0.32, 1)';
                    scrollWord.style.opacity = '1';
                    scrollWord.style.transform = 'translateY(0)';
                }, 50);
            }, 500);
        }, 3000);
    
        // Alpha Download Modal Logic
        const dlModal = document.getElementById('dl-modal');
        const dlTitle = document.getElementById('dl-title');
        const dlCheck = document.getElementById('tos-check');
        const dlConfirm = document.getElementById('dl-confirm');
        const dlCancel = document.getElementById('dl-cancel');
        let activeDownloadFile = "";

        document.querySelectorAll('.dl-trigger').forEach(btn => {
            btn.addEventListener('click', () => {
                activeDownloadFile = btn.getAttribute('data-file');
                dlTitle.textContent = "Download " + btn.getAttribute('data-name');
                dlModal.classList.add('active');
                dlCheck.checked = false;
                dlConfirm.classList.remove('ready');
            });
        });

        dlCheck.addEventListener('change', () => {
            if (dlCheck.checked) {
                dlConfirm.classList.add('ready');
            } else {
                dlConfirm.classList.remove('ready');
            }
        });

        dlCancel.addEventListener('click', () => {
            dlModal.classList.remove('active');
        });

        dlConfirm.addEventListener('click', () => {
            if (dlCheck.checked && activeDownloadFile) {
                const link = document.createElement('a');
                link.href = activeDownloadFile;
                link.download = activeDownloadFile.split('/').pop();
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                dlModal.classList.remove('active');
            }
        });

        // Close modal on background click
        dlModal.addEventListener('click', (e) => {
            if (e.target === dlModal) dlModal.classList.remove('active');
        });

    <style>
        .vst-modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(20px);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .vst-modal-overlay.active { display: flex; }
        .vst-modal-content {
            background: var(--bg); border: 1px solid var(--border); border-radius: 24px;
            padding: 40px; width: 90%; max-width: 500px; text-align: center;
            box-shadow: 0 20px 60px rgba(0,191,255,0.1);
        }
    </style>

    <script>
        // A/B Slider Logic
        const abSlider = document.getElementById('ab-slider');
        const abAfter = document.getElementById('ab-after');
        const abLine = document.getElementById('ab-line');
        const abHandle = document.getElementById('ab-handle');

        abSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            abAfter.style.clipPath = `polygon(${val}% 0, 100% 0, 100% 100%, ${val}% 100%)`;
            abLine.style.left = `${val}%`;
            abHandle.style.left = `${val}%`;
        });

        // Prestige Download Modal Logic
        const modal = document.getElementById('vst-modal');
        const modalTitle = document.getElementById('modal-vst-name');
        const vstForm = document.getElementById('vst-form');
        const hiddenVst = document.getElementById('modal-hidden-vst');
        const triggers = document.querySelectorAll('.trigger-modal');
        let currentDownloadLink = "";
        
        triggers.forEach(btn => {
            btn.addEventListener('click', () => {
                const vstName = btn.getAttribute('data-vst');
                modalTitle.textContent = vstName;
                hiddenVst.value = vstName;
                currentDownloadLink = btn.getAttribute('data-link');
                modal.classList.add('active');
            });
        });

        document.getElementById('modal-cancel').addEventListener('click', () => {
            modal.classList.remove('active');
        });
        
        vstForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('modal-download-btn');
            submitBtn.textContent = "AUTHORIZING...";
            submitBtn.style.pointerEvents = "none";
            submitBtn.style.opacity = "0.5";

            const formData = new FormData(vstForm);

            fetch("/", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: new URLSearchParams(formData).toString()
            })
            .then(() => {
                // Trigger actual download
                const link = document.createElement('a');
                link.href = currentDownloadLink;
                link.download = currentDownloadLink.split('/').pop();
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                // Reset UI
                modal.classList.remove('active');
                submitBtn.textContent = "I AGREE, DOWNLOAD";
                submitBtn.style.pointerEvents = "auto";
                submitBtn.style.opacity = "1";
                vstForm.reset();
            })
            .catch(err => {
                alert("Authorization failed. Please try again.");
                submitBtn.textContent = "I AGREE, DOWNLOAD";
                submitBtn.style.pointerEvents = "auto";
                submitBtn.style.opacity = "1";
            });
        });

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('active'); });
        }, { threshold: 0.1 });
        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    
        // Alpha Download Modal Logic
        const dlModal = document.getElementById('dl-modal');
        const dlTitle = document.getElementById('dl-title');
        const dlCheck = document.getElementById('tos-check');
        const dlConfirm = document.getElementById('dl-confirm');
        const dlCancel = document.getElementById('dl-cancel');
        let activeDownloadFile = "";

        document.querySelectorAll('.dl-trigger').forEach(btn => {
            btn.addEventListener('click', () => {
                activeDownloadFile = btn.getAttribute('data-file');
                dlTitle.textContent = "Download " + btn.getAttribute('data-name');
                dlModal.classList.add('active');
                dlCheck.checked = false;
                dlConfirm.classList.remove('ready');
            });
        });

        dlCheck.addEventListener('change', () => {
            if (dlCheck.checked) {
                dlConfirm.classList.add('ready');
            } else {
                dlConfirm.classList.remove('ready');
            }
        });

        dlCancel.addEventListener('click', () => {
            dlModal.classList.remove('active');
        });

        dlConfirm.addEventListener('click', () => {
            if (dlCheck.checked && activeDownloadFile) {
                const link = document.createElement('a');
                link.href = activeDownloadFile;
                link.download = activeDownloadFile.split('/').pop();
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                dlModal.classList.remove('active');
            }
        });

        // Close modal on background click
        dlModal.addEventListener('click', (e) => {
            if (e.target === dlModal) dlModal.classList.remove('active');
        });


    <!-- Alpha Download Modal -->
    <div class="dl-modal-overlay" id="dl-modal">
        <div class="dl-modal">
            <div class="dl-modal-title" id="dl-title">Download Plugin</div>
            <div class="dl-modal-sub">Alpha Release v1.0.0</div>
            
            <div class="dl-tos-box">
                > BLACKLIST TECHNICAL STANDARD<br>
                > ALPHA STATUS: EXPERIMENTAL<br>
                > NO WARRANTY PROVIDED<br><br>
                1. This software is in ALPHA. It may crash your DAW or system.<br>
                2. You use this software at your own risk.<br>
                3. You agree to the full Blacklist Tech EULA.<br>
                4. Redistribution is strictly prohibited.<br><br>
                Full Terms: <a href="/legal/" target="_blank">blacklisttech.com/legal/</a>
            </div>

            <div class="dl-check-row" id="dl-check-container">
                <input type="checkbox" id="tos-check">
                <label for="tos-check">I have read the <a href="/legal/" target="_blank">EULA</a> and accept all risks associated with using experimental Alpha software.</label>
            </div>

            <div class="dl-btn-row">
                <button class="dl-btn-cancel" id="dl-cancel">CANCEL</button>
                <button class="dl-btn-go" id="dl-confirm">DOWNLOAD</button>
            </div>
        </div>
    </div>
